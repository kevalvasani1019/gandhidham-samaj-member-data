{% extends 'base.html' %}
{% load static %}

{% block title %}Member Form - Shri Kutch Kadva Patidar Samaj{% endblock %}

{% block extra_css %}
<style>
.form-row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
}

.form-row label {
    width: 150px;
    font-weight: bold;
    color: #333;
}

.form-row input,
.form-row select {
    width: 220px;
    padding: 5px;
    margin-right: 20px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button.save-btn {
    background-color: #2c6cb2;
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
}

button.save-btn:hover {
    background-color: #1a4e80;
}

.save-container {
    display: flex;
    align-items: center;
    margin-top: 20px;
}

.image-preview {
    margin-bottom: 15px;
}
.image-preview img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid #ccc;
}
</style>
{% endblock %}

{% block content %}
<h2 style="text-align:center;">Edit Member</h2>

<form id="memberForm" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-row">
       <div style="flex: 1; width: 70%; text-align: left;">
            <label>Yuvak Mandal ID:</label>
            <input name="yuvak_mandal_id" type="text"
                   style="height: 25px; width: 50px; font-size: medium; font-weight: bold;"
                   value="{{ member.yuvak_mandal_id|default_if_none:'' }}" required>
        </div>
        <div style="flex: 1; width: 30%; text-align: left;">
            <label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Mobile No.:</label>
            <input name="mobile_number" type="text"
                   style="height: 25px; width: 150px; font-size: larger;"
                   value="{{ member.mobile_number|default_if_none:'' }}"
                   placeholder="Mobile number" required>
        </div>
    </div>
    <br>

    <div class="form-row">
        <div style="flex: 1; width: 80%; text-align: left;">
        <label>Member Name:</label>
        <input name="member_name" type="text"
               style="height: 25px; width: 400px; font-weight: bold; font-size: larger;"
               value="{{ member.member_name|default_if_none:'' }}">
    </div>
        <div style="flex: 1; width: 20%; text-align: left;">
       <label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Relationship:</label>
        <select name="relationship" style="width: 100px;">
            <option value="">Select</option>
            {% for item in relationship_types %}
                <option value="{{ item.id }}" {% if member.relationship_id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
        </div>
    </div>
    <br>

    <div class="form-row">
        <label>Member Address:</label>
        <input name="plot_number" style="width: 150px;" type="text" placeholder="Plot number" value="{{ plot_number }}">
        <input name="landmark" style="width: 150px;" type="text" placeholder="Land mark" value="{{ landmark }}">
        <input name="city" style="width: 150px;" type="text" placeholder="City" value="{{ city }}">
        <input name="state" style="width: 150px;" type="text" placeholder="State" value="{{ state }}">
    </div>
    <br>

    <div class="form-row">
        <label>Type of Business:</label>
        <select name="business_type" style="width: 200px;">
            <option value="">Select</option>
            {% for item in business_types %}
                <option value="{{ item.id }}" {% if member.type_of_business_id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
        <label>&nbsp;&nbsp;&nbsp;Business name:</label>
        <input name="business" type="text"
               style="height: 25px; width: 300px; font-weight: bold; font-size: larger;"
               value="{{ member.business|default_if_none:'' }}" placeholder="Business name">
    </div>
    <br>

    <div class="form-row">
        <label>Date of Birth:</label>
        <input name="date_of_birth" type="date" style="width: 150px;" value="{{ member.date_of_birth|date:'Y-m-d' }}">
        <label>&nbsp;&nbsp;&nbsp;Blood Group:</label>
        <select name="blood_group" style="width: 100px;">
            <option value="">Select</option>
            {% for item in blood_groups %}
                <option value="{{ item.id }}" {% if member.blood_group_id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
        <label>&nbsp;&nbsp;&nbsp;Marital Status:</label>
        <select name="marital_status" style="width: 200px;">
            <option value="">Select</option>
            {% for item in marital_statuses %}
                <option value="{{ item.id }}" {% if member.marital_status_id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
    </div>
    <br>

    <div class="save-container">
        <div style="flex: 0 0 30%;">
            {% if member.photo %}
            <div class="image-preview">
                <img src="{{ member.photo.url }}" alt="Member Photo">
            </div>
            {% endif %}
            <input type="file" name="photo" accept="image/*">
        </div>
        <div style="flex: 0 0 70%; padding-left: 20px;">
            <button type="submit" id="submitBtn" class="save-btn">
                <i class="fa fa-save"></i> {% if member %}Update{% else %}Save{% endif %}
            </button>
        </div>
    </div>
</form>

<!-- AJAX SCRIPT -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$("#memberForm").on("submit", function(e) {
    e.preventDefault();

    let formData = new FormData(this);

    $.ajax({
        url: "",  // same URL
        type: "POST",
        data: formData,
        processData: false,
        contentType: false,

        success: function(response) {
            alert("Member saved!");
            window.location.href = "/member/";
            console.log(response);
        },

        error: function(xhr) {
            alert("Error: Data not saved");
            console.log(xhr.responseText);
        }
    });
});
</script>

{% endblock %}
