{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
.poster {
    height: 250px;
    width: 70%; /* <-- Updated this line to 100% to fill the card */
    object-fit: cover;
    margin-left: auto;
    margin-right: auto;
    display: block;
}
</style>
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        {% for project in projects %}
            <div class="card shadow-lg border-0 h-100 text-center p-3">
                <img src="{% static project.image %}" alt="{{ project.title }}" class="card-img-top img-fluid rounded poster">
                <div class="card-body">
                    <h4 class="card-title mt-2">{{ project.title }}</h4>
                    <p class="card-text">
                        {{ project.description }}
                    </p>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
